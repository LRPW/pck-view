name: PCK View — Windows

on:
  push:
    branches: [ '**' ]
    tags: [ 'pckview-v*', 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pckview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check application and tag versions
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw 'Versions in package.json, tauri.conf.json and Cargo.toml must match.'
          }
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^(?:pckview-)?v(.+)$' -or $Matches[1] -ne $packageVersion) {
              throw "Release tag must be pckview-v$packageVersion or v$packageVersion."
            }
          }
          "APP_VERSION=$packageVersion" >> $env:GITHUB_ENV

      - name: Install locked frontend dependencies
        run: |
          npm install --global yarn@1.22.22
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          yarn install --frozen-lockfile --non-interactive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Frontend tests
        run: npm test

      - name: Build frontend for backend tests
        run: npm run build

      - name: Backend tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build release executable
        run: npm run tauri build -- --ci --no-bundle --target x86_64-pc-windows-msvc -- --locked

      - name: Prepare executable and SHA-256 checksum
        run: |
          $ErrorActionPreference = 'Stop'
          $fileName = "LRPW-PCK-View-$env:APP_VERSION-windows-x64.exe"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath src-tauri/target/x86_64-pc-windows-msvc/release/pckview.exe -Destination "release/$fileName"
          $hash = (Get-FileHash -LiteralPath "release/$fileName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $fileName" | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: pckview-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ github.run_id }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download tested build
        run: gh run download "$BUILD_RUN_ID" --name pckview-windows-x64 --dir release

      - name: Publish executable and checksum
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            version="${RELEASE_TAG#pckview-}"
            version="${version#v}"
            options=(--verify-tag --title "LRPW | PCK View $version" --generate-notes)
            if [[ "$version" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release/* "${options[@]}"
          fi
