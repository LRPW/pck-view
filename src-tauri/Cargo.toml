[package]
name = "pw-forge"
version = "0.1.4"
edition = "2021"
default-run = "pwforge"

[[bin]]
name = "pwforge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
encoding_rs = "0.8"
tempfile = "3"
regex = "1"
serde_json = "1"

quick-xml = "0.42"
base64 = "0.23"
tauri-plugin-updater = "2"
